# Local services for development and tests:
#   docker compose up -d
# Postgres:  postgres://klotilda:klotilda@localhost:5435/klotilda
# Mailpit:   SMTP on localhost:1026, inbox at http://localhost:8026
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: klotilda
      POSTGRES_PASSWORD: klotilda
      POSTGRES_DB: klotilda
    ports:
      - '5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U klotilda']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1026:1025'
      - '8026:8025'
