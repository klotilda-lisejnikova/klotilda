<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the bottom bar pads itself above the iPhone's home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Installable as an app: the manifest and the iPhone's own tags (scripts/generate-icons.mjs). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Klotilda admin" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <title>Klotilda · admin</title>
    <!-- The saved light/dark choice, before the first paint (a plain script, not bundled). -->
    <script src="/color-scheme.js"></script>
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
